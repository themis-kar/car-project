<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Car Garage</title>
    <link rel="stylesheet" href="styles.css"> <!-- External CSS -->
</head>
<body>
    <header>
        <h1>Welcome to my Car Garage application</h1>
    </header>

    <section id="intro">
        <h2>Menu</h2>
        <p>Use the buttons below to manage your car collection.</p>
    </section>

    <nav id="navbar">
        <button id="btn-view">View Cars</button>
        <button id="btn-add">Add Car</button>
        <button id="btn-update">Update Car Details</button>
        <button id="btn-delete">Delete Car</button>
        <button id="btn-filter">Filter by</button>
    </nav>

    <main id="content-area">
        <!-- Dynamic content will be loaded here -->
    </main>

    <div id="form-overlay" class="hidden"></div>
    
    <div id="form-banner" class="hidden"></div>
    <script src="scripts.js"></script> <!-- External JavaScript -->
</body>
</html>
